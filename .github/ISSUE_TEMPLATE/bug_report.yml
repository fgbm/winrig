name: Сообщение об ошибке
description: Поведение расходится с документацией
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за сообщение. Не вставляйте секреты: заменяйте пароли и токены на плейсхолдеры.
        Уязвимости сюда не относятся — следуйте [SECURITY.md](https://github.com/fgbm/winrig/blob/main/SECURITY.md).
  - type: textarea
    id: observed
    attributes:
      label: Что происходит
      description: Наблюдаемое поведение, включая имя инструмента и ответ, который получил агент.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что вы ожидали
      description: Что, по README или docs/REQUIREMENTS.md, должно происходить. Приведите строку, если можете.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Воспроизведение
      description: Минимальная последовательность, которая приводит к ошибке. Секреты заменены на плейсхолдеры.
      placeholder: |
        1. winrig setup corp --user 'DOMAIN\user'
        2. winrig serve --profile corp
        3. вызвать инструмент X с ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия
      description: Тег релиза или вывод `winrig --version`.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Режим запуска
      options:
        - stdio
        - serve (HTTP)
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP-клиент и версия
      placeholder: opencode 1.18.31, Claude Code 2.x, ...
    validations:
      required: false
  - type: input
    id: platform
    attributes:
      label: Платформа
      description: ОС, на которой работает winrig, и версия Windows-хоста, если это важно.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Журналы
      description: Относящиеся к делу строки из winrig.log или аудита, с вырезанными секретами.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Чек-лист
      options:
        - label: Я сверился с текущим README и docs/REQUIREMENTS.md.
          required: true
        - label: Это не сообщение об уязвимости (те идут через SECURITY.md).
          required: true
        - label: Секреты, пароли и токены вырезаны из всего выше.
          required: true
