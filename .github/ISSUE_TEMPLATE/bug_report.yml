name: Bug report
description: Something behaves differently from the documentation
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not paste secrets: replace passwords and tokens with placeholders.
        A security issue does not belong here — follow [SECURITY.md](https://github.com/fgbm/winrig/blob/main/SECURITY.md) instead.
  - type: textarea
    id: observed
    attributes:
      label: What happens
      description: The observed behaviour, including the tool name and the reply the agent got.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What the README or docs/REQUIREMENTS.md says should happen. Quote the line if you can.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest sequence that triggers it. Secrets replaced by placeholders.
      placeholder: |
        1. winrig setup corp --user 'DOMAIN\user'
        2. winrig serve --profile corp
        3. call tool X with ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: A release tag, or the output of `winrig --version`.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Run mode
      options:
        - stdio
        - serve (HTTP)
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client and version
      placeholder: opencode 1.18.31, Claude Code 2.x, ...
    validations:
      required: false
  - type: input
    id: platform
    attributes:
      label: Platform
      description: The OS winrig runs on, and the Windows host version if it matters.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from winrig.log or the audit trail, with secrets redacted.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I checked this against the current README and docs/REQUIREMENTS.md.
          required: true
        - label: This is not a security report (those go through SECURITY.md).
          required: true
        - label: Secrets, passwords and tokens are redacted from everything above.
          required: true
