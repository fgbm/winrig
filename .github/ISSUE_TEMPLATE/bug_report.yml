name: Bug report
description: The behavior disagrees with the documentation
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Do not paste secrets: replace passwords and tokens with placeholders.
        Vulnerabilities do not belong here — follow [SECURITY.md](https://github.com/fgbm/winrig/blob/main/SECURITY.md).
  - type: textarea
    id: observed
    attributes:
      label: What happens
      description: The observed behavior, including the tool name and the reply that the agent got.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What must happen by the README or docs/REQUIREMENTS.md. Give the line, if you can.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest sequence that causes the error. Replace secrets with placeholders.
      placeholder: |
        1. winrig setup corp --user 'DOMAIN\user'
        2. winrig serve --profile corp
        3. call tool X with ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag or the output of `winrig --version`.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Start mode
      options:
        - stdio
        - serve (HTTP)
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client and version
      placeholder: opencode 1.18.31, Claude Code 2.x, ...
    validations:
      required: false
  - type: input
    id: platform
    attributes:
      label: Platform
      description: The OS that runs winrig, and the version of the Windows host, if that is important.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant lines from winrig.log or the audit, with the secrets cut out.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I checked the current README and docs/REQUIREMENTS.md.
          required: true
        - label: This is not a vulnerability report (those go through SECURITY.md).
          required: true
        - label: Secrets, passwords and tokens are cut out of everything above.
          required: true
