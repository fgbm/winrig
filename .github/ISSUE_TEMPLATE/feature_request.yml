name: Feature request
description: A new tool, a configuration parameter or a capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        A new tool, an external system, a status or a channel come in **only through an ADR** (`docs/adr/`).
        Describe the need here first; if it is accepted, the decision is recorded before the code is written.
  - type: textarea
    id: problem
    attributes:
      label: Task
      description: What the operator or the agent cannot do today. Describe the need, not the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed capability
      description: The tool, parameter or behavior that you have in mind. Say whether it reads or changes.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risk and confirmation
      description: If the capability changes something, what must it refuse, and how must the confirmation work?
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What you tried instead, or why the existing tool does not cover the task.
    validations:
      required: false
  - type: textarea
    id: documents
    attributes:
      label: Related documents
      description: An existing ADR, a requirement (TR-*), a roadmap slice that this relates to.
      placeholder: ADR-0014, TR-AD-01, slice W19
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I looked for this among the existing issues and ADRs.
          required: true
        - label: I understand that a new capability requires an ADR before implementation.
          required: true
