name: Предложение возможности
description: Новый инструмент, параметр конфигурации или способность
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Новый инструмент, внешняя система, статус или канал вводятся **только через ADR** (`docs/adr/`).
        Сначала опишите потребность здесь; если она принята, решение записывается до того, как написан код.
  - type: textarea
    id: problem
    attributes:
      label: Задача
      description: Что оператор или агент не может сделать сегодня. Опишите потребность, а не реализацию.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемая возможность
      description: Инструмент, параметр или поведение, которые вы имеете в виду. Скажите, читает он или изменяет.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Риск и подтверждение
      description: Если возможность что-то изменяет, от чего она обязана отказать и как должно работать подтверждение?
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Рассмотренные альтернативы
      description: Что вы пробовали вместо этого или почему существующий инструмент не покрывает задачу.
    validations:
      required: false
  - type: textarea
    id: documents
    attributes:
      label: Связанные документы
      description: Существующий ADR, требование (TR-*), срез дорожной карты, к которому это относится.
      placeholder: ADR-0014, TR-AD-01, срез W19
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Чек-лист
      options:
        - label: Я поискал это среди существующих issue и ADR.
          required: true
        - label: Я понимаю, что новая возможность требует ADR до реализации.
          required: true
