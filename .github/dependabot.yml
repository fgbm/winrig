version: 2
updates:
  # Rust dependencies. Updates come as separate PRs and pass the full check
  # run (fmt, clippy, test, deny) before they reach main.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    groups:
      # One PR for all patch versions: they are almost always safe and do not
      # create a queue of twenty branches.
      patch-updates:
        applies-to: version-updates
        update-types: ["patch"]

  # The action versions in the workflows: pinned by major version, updated by
  # hand or by this PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
