name: CI

on:
  push:
    branches: [main]
  pull_request:

# Прогон обязан быть зелёным до коммита (AGENTS.md §6). Версия Rust берётся из
# rust-toolchain.toml, поэтому CI и локальная разработка совпадают.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  quality:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Release build
        run: cargo build --release

  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install MSRV toolchain
        run: rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: Build on MSRV
        run: cargo +"${{ steps.msrv.outputs.version }}" build --locked

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustsec/audit-check@v2 закреплён на Node 20, снятом с поддержки, а
      # релиза на Node 24 нет. Бинарь cargo-audit ставится тем же
      # install-action, что и остальные инструменты, и запускается напрямую.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Check advisories
        run: cargo audit

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
