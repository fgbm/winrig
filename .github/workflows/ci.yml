name: CI

on:
  push:
    branches: [main]
  pull_request:

# The check run must be green before a commit (AGENTS.md §6). The Rust
# version comes from rust-toolchain.toml, so CI and local development agree.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  VALE_VERSION: 3.24.0

jobs:
  quality:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Release build
        run: cargo build --release

  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install MSRV toolchain
        run: rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: Build on MSRV
        run: cargo +"${{ steps.msrv.outputs.version }}" build --locked

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustsec/audit-check@v2 is pinned to Node 20, which is out of support,
      # and there is no release on Node 24. The cargo-audit binary is installed
      # by the same install-action as the other tools and runs directly.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Check advisories
        run: cargo audit

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # The site is built on every pull request, so a broken page fails before the
  # merge. The audit fails only on a high or critical advisory.
  docs:
    name: Docs site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high

  # The style job lints the Markdown that is already English. The translation
  # commits extend the path list.
  vale:
    name: Style (Vale)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Vale
        run: |
          curl -sfL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" | tar xz -C "$RUNNER_TEMP" vale
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check text
        run: vale --minAlertLevel=error README.md README.ru.md AGENTS.md CONTRIBUTING.md SECURITY.md CHANGELOG.md docs/IMPLEMENTATION_CYCLE.md docs/QUESTIONS.md docs/REQUIREMENTS.md docs/ROADMAP.md docs/adr docs/style docs/site/src/content .github/PULL_REQUEST_TEMPLATE.md

  # The comment check of AGENTS.md section 10. The fixture proves the check is
  # not a no-op: the good fixture passes and the bad fixture must fail with the
  # expected number of findings.
  comments:
    name: Style (comments)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: Check comments
        run: |
          scripts/check-comments.sh
          scripts/check-comments.sh scripts/testdata/comments/good
          set +e
          bad="$(scripts/check-comments.sh scripts/testdata/comments/bad 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::check-comments.sh did not flag the fixture"
            exit 1
          fi
          count="$(printf '%s\n' "$bad" | grep -c '\[rule: ' || true)"
          if [ "$count" -ne 19 ]; then
            echo "::error::expected 19 findings in the fixture, got $count"
            printf '%s\n' "$bad"
            exit 1
          fi
