name: Release

# The tag `vX.Y.Z` is the only entry to a release (AGENTS.md §7). The work
# splits into two jobs: create-release takes the text from CHANGELOG.md and
# creates the GitHub Release, and upload-assets builds each target and attaches
# an archive with a checksum.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Refuse before the release is created: the version in Cargo.toml and the
      # tag go up in one commit (AGENTS.md §7), so a mismatch is a preparation
      # error, not a reason to publish a release with a wrong number.
      - name: Tag must match Cargo.toml
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$tag" != "$manifest" ]; then
            echo "tag v$tag does not match Cargo.toml version $manifest" >&2
            exit 1
          fi

  create-release:
    name: Create release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The text comes from the CHANGELOG entry with the version of the tag;
      # `branch: main` rejects a tag on a commit outside main. Each commit on
      # main already passed CI, so the quality is checked by the time of the tag.
      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          branch: main
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: musl gives a static binary with no glibc dependency. AWS-LC
          # (`aws-lc-sys`) and ring carry C code, so the build goes through
          # cross — the image has a musl compiler and cmake, which a bare
          # runner does not.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          # macOS and Windows build natively; the Intel label is pinned
          # explicitly, because macos-latest with macos-14 is arm64.
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: winrig
          target: ${{ matrix.target }}
          archive: winrig-$tag-$target
          locked: true
          checksum: sha256
          # The archive holds the license and a short description, so the
          # unpacked set is self-contained.
          include: LICENSE,README.md
          token: ${{ secrets.GITHUB_TOKEN }}
