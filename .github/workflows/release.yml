name: Release

# Тег `vX.Y.Z` — единственный вход в релиз (AGENTS.md §7). Работа делится на две
# части: create-release берёт текст из CHANGELOG.md и создаёт GitHub Release,
# upload-assets собирает под каждый таргет и прикладывает архив с чексуммой.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Отказ до создания релиза: версия в Cargo.toml и тег поднимаются одним
      # коммитом (AGENTS.md §7), и расхождение — ошибка подготовки, а не повод
      # выпустить релиз с чужим номером.
      - name: Tag must match Cargo.toml
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$tag" != "$manifest" ]; then
            echo "tag v$tag does not match Cargo.toml version $manifest" >&2
            exit 1
          fi

  create-release:
    name: Create release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # Текст берётся из записи CHANGELOG с версией тега; `branch: main`
      # отвергает тег на коммите вне main. Каждый коммит main уже прошёл CI,
      # поэтому к моменту тега качество проверено.
      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          branch: main
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: musl даёт статический бинарь без glibc-зависимости. AWS-LC
          # (`aws-lc-sys`) и ring несут C-код, поэтому сборка идёт через cross —
          # в образе есть musl-компилятор и cmake, которых нет на голом раннере.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          # macOS и Windows собираются нативно; Intel-лейбл закреплён явно,
          # потому что macos-latest с macos-14 — это arm64.
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: winrig
          target: ${{ matrix.target }}
          archive: winrig-$tag-$target
          locked: true
          checksum: sha256
          # В архив кладутся лицензия и краткое описание, чтобы распакованный
          # набор был самодостаточен.
          include: LICENSE,README.md
          token: ${{ secrets.GITHUB_TOKEN }}
