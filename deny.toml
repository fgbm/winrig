# cargo-deny: licenses and dependency sources.
# The license list is collected from `cargo metadata` of the current Cargo.lock;
# do not relax it without a record in an ADR.

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "MIT-0",
]
# The licenses in the lock file use different notations (`MIT/Apache-2.0`,
# `MIT OR Apache-2.0`); we trust the whole SPDX expression.
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
