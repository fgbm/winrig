# cargo-deny: лицензии и источники зависимостей.
# Список лицензий собран из `cargo metadata` текущего Cargo.lock; ослаблять
# его без записи в ADR не следует.

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "MIT-0",
]
# Лицензии в lock-файле выражены разными формами записи (`MIT/Apache-2.0`,
# `MIT OR Apache-2.0`); доверяем SPDX-выражению целиком.
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
