# Правило: без жаргона, термины из глоссария.
# В Go RE2 \b не работает с кириллицей, поэтому границы слова заданы явно.
extends: existence
message: "Жаргон: «%s». Используйте термин из глоссария (docs/style/ru-technical.md, раздел 6)."
level: error
ignorecase: true
nonword: true
tokens:
  - '(?:^|[^\p{L}])шар(?:а|ы|е|у|ой|ам|ами|ах)(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}])эндпоинт\p{L}*'
  - '(?:^|[^\p{L}])конфиг(?:а|е|у|ом|и|ов)?(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}])учётк\p{L}*'
  - '(?:^|[^\p{L}])аккаунт\p{L}*'
  - '(?:^|[^\p{L}])фич(?:а|и|е|у|ей)(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}])вайтлист\p{L}*'
  - '(?:^|[^\p{L}])лог(?:а|е|у|ом|и|ов|ам|ами|ах)?(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}])аудит-лог\p{L}*'
  - '(?:^|[^\p{L}])апрув\p{L}*'
  - '(?:^|[^\p{L}])тул(?:за|зы|зе|зу|зой|з)?(?:[^\p{L}]|$)'
