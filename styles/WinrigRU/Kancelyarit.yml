# Правило: без канцелярских оборотов.
# В Go RE2 \b не работает с кириллицей, поэтому границы слова заданы явно.
extends: existence
message: "Канцелярит: «%s». Перестройте фразу (docs/style/ru-technical.md, раздел 1)."
level: error
ignorecase: true
nonword: true
tokens:
  # Only adjective forms. The forms «данные», «данных», «данным», «данными» also mean "data".
  - '(?:^|[^\p{L}])данн(?:ый|ая|ое|ого|ой|ому|ом|ую)(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}])явля(?:ется|ются|лся|лась|лось|лись)(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}])осуществл\p{L}*'
  - '(?:^|[^\p{L}])(?:производить|производит|производится|производятся|произвести|произведён)(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}])в целях(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}])с целью(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}])в случае,? если(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}])в связи с тем,? что(?:[^\p{L}]|$)'
  - '(?:^|[^\p{L}])име(?:ет|ют) возможность(?:[^\p{L}]|$)'
